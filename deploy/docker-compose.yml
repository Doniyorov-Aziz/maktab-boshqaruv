# Maktab Boshqaruv - ommaviy DEMO server (Oracle Cloud Always Free, Ubuntu, ARM64 yoki AMD64).
# Ishga tushirish (shu papkada):  cp .env.example .env  ->  .env ni to'ldiring  ->  docker compose up -d --build
# Batafsil: docs/DEPLOY.md

name: maktab

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-maktab_db}
      POSTGRES_USER: ${DB_USERNAME:-maktab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da berilishi shart}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # JVM xotirasi shu chegaraning 60% i (-XX:MaxRAMPercentage=60)
    mem_limit: ${BACKEND_MEMORY:-3g}
    environment:
      SPRING_PROFILES_ACTIVE: server
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-maktab_db}
      DB_USERNAME: ${DB_USERNAME:-maktab}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env da berilishi shart}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env da berilishi shart}
      DOMAIN: ${DOMAIN:?DOMAIN .env da berilishi shart}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      GUEST_LOGIN_ENABLED: ${GUEST_LOGIN_ENABLED:-true}
      VISIT_HASH_SALT: ${VISIT_HASH_SALT:?VISIT_HASH_SALT .env da berilishi shart}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      APP_STORAGE_PATH: /data/storage
    volumes:
      - storage:/data/storage

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
