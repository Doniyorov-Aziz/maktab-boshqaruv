# Serverdagi ommaviy DEMO (profil: server; docker-compose shuni yoqadi - deploy/docker-compose.yml).
# Bu faylda HECH QANDAY sir yo'q: hammasi muhit o'zgaruvchilaridan (deploy/.env) olinadi.
# Diqqat: profil nomi "prod" emas - "prod" profilida demo simulyator o'chadi.

spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/maktab_db}
spring.datasource.username=${DB_USERNAME:maktab}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

# Bo'sh baza: shu login/parol bilan birinchi ADMIN yaratiladi. Parol berilmasa admin yaratilmaydi.
admin.seed.username=${ADMIN_USERNAME:admin}
admin.seed.password=${ADMIN_PASSWORD:}
# Namuna hisoblar (direktor/direktor123, ustoz1/ustoz123 ...) ommaviy serverda yaratilmaydi
app.seed.demo-users=false

# Faqat o'z domeni (Caddy bir xil manzildan beradi, lekin brauzer Origin yuborsa ham ruxsat)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://${DOMAIN:localhost}}

# Davomat va baholarni avtomatik to'ldiruvchi demo simulyator
app.demo.enabled=${DEMO_ENABLED:true}
# #/demo havolasi: login/parolsiz "Mehmon" (faqat ko'rish)
app.guest.login-enabled=${GUEST_LOGIN_ENABLED:true}
# Tashrifchilar IP manzili faqat shu tuz bilan SHA-256 xesh ko'rinishida saqlanadi
app.demo.visit-hash-salt=${VISIT_HASH_SALT:}

# Telegram bot bir vaqtda faqat BITTA joyda ishlay oladi (getUpdates). Serverda yoqsangiz,
# kompyuteringizdagi nusxada TELEGRAM_ENABLED=false qiling.
telegram.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
telegram.webapp-url=${TELEGRAM_WEBAPP_URL:}

# Fayllar (murojaat ilovalari, kutubxona PDF lari) - docker volume
app.storage.path=${APP_STORAGE_PATH:/data/storage}

# Caddy orqasida: mijozning haqiqiy IP manzili (X-Forwarded-For) va https sxemasi
server.forward-headers-strategy=native
