spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/maktab_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

admin.seed.username=${ADMIN_USERNAME:admin}
admin.seed.password=${ADMIN_PASSWORD:admin123}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:9000}

# Telegram bot (ota-onalar uchun xabarnomalar). Token HECH QACHON shu faylga yozilmaydi:
# u faqat application-local.properties (telegram.bot-token=...) yoki TELEGRAM_BOT_TOKEN
# muhit o'zgaruvchisidan olinadi. Batafsil: docs/15-telegram-bot.md
telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.mock=${TELEGRAM_MOCK:false}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
telegram.quiet-hours-start=${TELEGRAM_QUIET_START:22:00}
telegram.quiet-hours-end=${TELEGRAM_QUIET_END:07:00}
# Mini App ("Farzandim kundaligi") uchun HTTPS manzil. Bo'sh bo'lsa - tugma ko'rsatilmaydi.
telegram.webapp-url=${TELEGRAM_WEBAPP_URL:}
# getUpdates long-poll so'rovi oqimni 25 soniyagacha band qiladi - shuning uchun bittadan ortiq scheduler oqimi kerak
spring.task.scheduling.pool.size=3
# Ota-onalar murojaatlaridagi fayllar (rasm, video, ovozli xabar, hujjat) shu papkaga saqlanadi.
# Papka gitga tushmaydi (.gitignore). Prod da doimiy disk yo'li bering: APP_STORAGE_PATH=/var/lib/maktab/storage
app.storage.path=${APP_STORAGE_PATH:./storage}
# Murojaatga javob / ota-onalarga xabar fayllari: bitta fayl 20 MB gacha (Telegram chegarasi), bir so'rovda 10 tagacha
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=210MB
# Bot update'larini qayta ishlovchi oqimlar (8-16) va navbat chegarasi
telegram.update-threads=${TELEGRAM_UPDATE_THREADS:8}
telegram.update-max-threads=${TELEGRAM_UPDATE_MAX_THREADS:16}
telegram.update-queue=${TELEGRAM_UPDATE_QUEUE:2000}