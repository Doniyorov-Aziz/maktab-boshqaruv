# ---- приветствие и подключение ----
start.welcome=👋 <b>Здравствуйте!</b>\n\nЯ — бот <b>{app}</b>, школьный помощник вашего ребёнка:\n\n📅 Расписание и уроки на завтра\n✅ Посещаемость — сразу сообщу о пропуске или опоздании\n📘 Оценки, отчёты и объявления школы\n💬 Связь со школой напрямую\n\n<b>Чтобы подключиться,</b> нажмите одну из кнопок ниже 👇\n📱 <b>Поделиться номером</b> — по номеру, записанному в школе\n🔑 <b>Ввести код</b> — код с карточки от классного руководителя\n<i>Если отсканировать QR-код, подключение произойдёт само.</i>
start.share_button=📱 Поделиться номером
link.code_not_found=❌ Код не найден. Попросите ссылку у классного руководителя ещё раз или нажмите /start и поделитесь номером.
link.rate_limited=⏳ Слишком много неверных попыток. Попробуйте через 10 минут.
link.not_own_contact=⚠️ Пожалуйста, отправьте только <b>свой</b> номер кнопкой «📱 Поделиться номером».
link.phone_not_found=😕 Этот номер не найден в базе школы.\nПопросите у классного руководителя QR-код или ссылку.
link.success=✅ <b>Поздравляем!</b> Теперь всё о ребёнке <b>{name}</b> ({class} класс) — здесь.
link.success_many=✅ <b>Поздравляем!</b> По вашему номеру подключено детей: {count}\n{list}
link.list_item=• <b>{name}</b> — {class} класс
link.intro=<b>Знакомство в 3 шага:</b>\n1️⃣ Кнопки внизу — основные разделы: расписание, посещаемость, оценки и другие\n2️⃣ Важные события — пропуск, новая оценка, объявление — придут сами\n3️⃣ В «⚙️ Настройках» выберите, какие сообщения и когда получать

