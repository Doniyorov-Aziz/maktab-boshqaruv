# Tests only (classpath:/config/ wins over the main application.properties):
# the attendance automation does not run on its own while tests share the database;
# AttendanceAutomationTest calls it directly with a fixed clock.
attendance.automation-cron=-

# Many test classes get their own Spring context (different properties) and Spring keeps them
# cached; a small pool per context keeps PostgreSQL under its max_connections.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# Demo mode is on by default in the app; tests switch it on only where they test it, and never
# fill 30 days at startup.
app.demo.enabled=false
app.demo.startup-backfill-days=0
